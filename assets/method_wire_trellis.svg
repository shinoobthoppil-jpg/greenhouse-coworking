<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTrellis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#182c20" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgTrellis)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">HIGH-TENSILE WIRE VINE TRELLIS (BIO-SHADING)</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Marine-Grade 316 Stainless Wire • Under-Glass Roof Canopy • 3-5°C Passive Solar Cooling</text>

  <!-- Wire Trellis Diagram -->
  <g transform="translate(60, 105)">
    <!-- Glass Roof Trusses Top -->
    <polygon points="0,0 360,-20 360,10 0,30" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="180" y="18" text-anchor="middle" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Greenhouse Glass Roof</text>

    <!-- Tensioned Wire Grid -->
    <line x1="20" y1="50" x2="340" y2="30" stroke="#cbd5e1" stroke-width="2" />
    <line x1="20" y1="85" x2="340" y2="65" stroke="#cbd5e1" stroke-width="2" />
    <line x1="20" y1="120" x2="340" y2="100" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Turnbuckles -->
    <rect x="10" y="46" width="10" height="8" fill="#94a3b8" />
    <rect x="10" y="81" width="10" height="8" fill="#94a3b8" />
    <rect x="10" y="116" width="10" height="8" fill="#94a3b8" />

    <!-- Passionfruit Vines & Leaves Canopy -->
    <path d="M 40 280 Q 80 150 120 70 Q 200 40 320 35" stroke="#15803d" stroke-width="5" fill="none" />
    <path d="M 60 280 Q 110 180 160 85 Q 240 60 340 55" stroke="#16a34a" stroke-width="4" fill="none" />

    <!-- Passionfruit Leaves Clusters -->
    <circle cx="120" cy="70" r="16" fill="#22c55e" />
    <circle cx="160" cy="55" r="18" fill="#15803d" />
    <circle cx="210" cy="45" r="20" fill="#16a34a" />
    <circle cx="260" cy="40" r="22" fill="#22c55e" />
    <circle cx="310" cy="35" r="18" fill="#15803d" />
    <!-- Hanging Passion Fruit -->
    <circle cx="180" cy="75" r="9" fill="#7e22ce" />
    <circle cx="240" cy="65" r="9" fill="#7e22ce" />

    <!-- Dutch Bucket Root Base -->
    <rect x="30" y="240" width="50" height="50" fill="#334155" stroke="#64748b" stroke-width="1.5" rx="4" />
    <text x="55" y="270" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Root Basin</text>
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(450, 105)">
    <rect width="300" height="295" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" rx="8" />
    <text x="20" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">BIO-SHADING PHYSICS</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Natural Solar Interception</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Leaves intercept 40-60% of tropical solar radiation.</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. Evapotranspiration Cooling</text>
    <text x="20" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Vines release moisture, cooling indoor air by 3–5°C.</text>

    <text x="20" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. High-Ridge Catwalk Access</text>
    <text x="20" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Level 2 catwalk enables effortless pruning &amp; harvest.</text>

    <text x="20" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Edible Fruit Harvest</text>
    <text x="20" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Passion fruit, dessert grapes, Malabar climbing spinach.</text>
  </g>
</svg>