<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121815" />
      <stop offset="100%" stop-color="#1c2b23" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgSip)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">SUB-IRRIGATED WICKING PLANTER (SIP)</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Capillary Action Bottom Reservoir • 3-Week Refill Cycle • Mosquito-Free Dry Surface</text>

  <!-- Cutaway Planter Box -->
  <g transform="translate(80, 110)">
    <!-- Outer Cedar Box -->
    <rect x="0" y="30" width="340" height="260" fill="url(#woodGrad)" stroke="#451a03" stroke-width="3" rx="8" />

    <!-- Organic Soil Layer -->
    <rect x="15" y="45" width="310" height="150" fill="#3f2e21" />
    <text x="170" y="115" text-anchor="middle" fill="#d6d3d1" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">ORGANIC SOIL / COMPOST (12" DEPTH)</text>

    <!-- Separation Geotextile Fabric -->
    <line x1="15" y1="195" x2="325" y2="195" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4" />

    <!-- Water Reservoir Bottom Layer -->
    <rect x="15" y="198" width="310" height="80" fill="rgba(6, 182, 212, 0.4)" />
    <text x="170" y="245" text-anchor="middle" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">WATER RESERVOIR (4" WATER TABLE)</text>

    <!-- Wicking Columns -->
    <rect x="50" y="198" width="40" height="80" fill="#3f2e21" stroke="#38bdf8" stroke-width="1" />
    <rect x="250" y="198" width="40" height="80" fill="#3f2e21" stroke="#38bdf8" stroke-width="1" />
    <text x="70" y="235" text-anchor="middle" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Wick</text>
    <text x="270" y="235" text-anchor="middle" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Wick</text>

    <!-- PVC Fill Pipe -->
    <rect x="290" y="10" width="20" height="250" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="2" />
    <polygon points="285,10 315,10 300,-5" fill="#38bdf8" />
    <text x="235" y="15" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Fill Tube</text>

    <!-- Overflow Hole -->
    <circle cx="15" cy="198" r="6" fill="#f43f5e" />
    <text x="0" y="190" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Overflow</text>

    <!-- Plants Growing on Top -->
    <circle cx="80" cy="30" r="22" fill="#22c55e" />
    <circle cx="150" cy="20" r="28" fill="#16a34a" />
    <circle cx="220" cy="30" r="24" fill="#15803d" />
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(460, 110)">
    <rect width="290" height="295" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" rx="8" />
    <text x="20" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">SIP DESIGN BENEFITS</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Capillary Wicking</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Soil naturally draws moisture upward as needed.</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. Dry Surface = Zero Pests</text>
    <text x="20" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Top 2" soil stays dry, preventing fungus gnats.</text>

    <text x="20" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. 3-Week Water Independence</text>
    <text x="20" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Huge reservoir requires refilling only 1-2x/month.</text>

    <text x="20" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Ideal Locations</text>
    <text x="20" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Entrance pathways, perimeter patio, workshop borders.</text>
  </g>
</svg>