<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKratky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181308" />
      <stop offset="100%" stop-color="#2d220d" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgKratky)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">PASSIVE KRATKY METHOD (DESK HYDROPONICS)</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Zero Electricity • Zero Pumps • Expanding Air Gap Oxygenation</text>

  <!-- Mason Jar Diagram Left -->
  <g transform="translate(100, 110)">
    <!-- Glass Jar Outer Contour -->
    <rect x="30" y="40" width="200" height="260" fill="rgba(255, 255, 255, 0.05)" stroke="#e2e8f0" stroke-width="3" rx="16" />
    
    <!-- Net Pot Top -->
    <polygon points="80,40 180,40 165,85 95,85" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="130" cy="60" r="15" fill="#92400e" />
    
    <!-- Plant on Top -->
    <g transform="translate(130, 35)">
      <path d="M 0 0 Q -30 -40 -60 -30 Q -40 10 0 0" fill="#22c55e" />
      <path d="M 0 0 Q 30 -40 60 -30 Q 40 10 0 0" fill="#16a34a" />
      <path d="M 0 0 Q 0 -50 0 -70 Q 20 -40 0 0" fill="#4ade80" />
      <path d="M 0 0 Q -20 -60 -40 -70 Q -10 -30 0 0" fill="#15803d" />
      <path d="M 0 0 Q 20 -60 40 -70 Q 10 -30 0 0" fill="#22c55e" />
    </g>

    <!-- Air Gap Zone -->
    <rect x="33" y="85" width="194" height="85" fill="rgba(245, 158, 11, 0.1)" />
    <text x="130" y="130" text-anchor="middle" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">OXYGEN ROOT ZONE (AIR GAP)</text>

    <!-- Water Nutrient Zone -->
    <rect x="33" y="170" width="194" height="127" fill="rgba(6, 182, 212, 0.25)" rx="0 0 14 14" />
    <text x="130" y="240" text-anchor="middle" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">NUTRIENT SOLUTION (WATER)</text>

    <!-- Dangling Roots -->
    <path d="M 110 85 Q 90 140 100 230 M 130 85 Q 135 150 125 260 M 150 85 Q 170 140 155 240 M 120 85 Q 115 160 140 250 M 140 85 Q 150 160 110 270" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.9" />
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(380, 110)">
    <rect width="370" height="295" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.3)" rx="8" />
    <text x="22" y="32" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">HOW THE KRATKY METHOD WORKS</text>
    
    <text x="22" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Fill Once at Planting</text>
    <text x="22" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Container is filled with water + nutrients up to net pot bottom.</text>

    <text x="22" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. Water Level Naturally Recedes</text>
    <text x="22" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">As plant consumes water, air space automatically expands.</text>

    <text x="22" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. Dual Root Specialization</text>
    <text x="22" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Top roots absorb 100% pure air oxygen; bottom roots drink water.</text>

    <text x="22" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Co-Working Desk Integration</text>
    <text x="22" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">100% spill-proof, silent, zero cables. Fresh basil at every desk.</text>
  </g>
</svg>