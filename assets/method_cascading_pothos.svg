<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPothos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f18" />
      <stop offset="100%" stop-color="#16382b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgPothos)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">CASCADING STEEL GIRDER TROUGHS (LIVING CURTAINS)</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Integrated I-Beam Planter Troughs • 3-4m Trailing Vines • Natural Visual Privacy Filters</text>

  <!-- Industrial Steel Girder Diagram -->
  <g transform="translate(60, 105)">
    <!-- Steel I-Beam Top -->
    <rect x="0" y="0" width="360" height="15" fill="url(#beamGrad)" stroke="#64748b" stroke-width="1.5" />
    <rect x="160" y="15" width="40" height="30" fill="url(#beamGrad)" />
    <rect x="0" y="45" width="360" height="15" fill="url(#beamGrad)" stroke="#64748b" stroke-width="1.5" />

    <!-- Planter Trough on top of beam -->
    <rect x="20" y="-20" width="320" height="20" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="3" />

    <!-- Cascading Pothos Vines Hanging Down -->
    <path d="M 40 5 Q 30 100 45 220" stroke="#15803d" stroke-width="3" fill="none" />
    <path d="M 90 5 Q 110 80 85 260" stroke="#16a34a" stroke-width="3.5" fill="none" />
    <path d="M 150 5 Q 130 120 160 280" stroke="#22c55e" stroke-width="4" fill="none" />
    <path d="M 210 5 Q 230 110 200 240" stroke="#15803d" stroke-width="3" fill="none" />
    <path d="M 270 5 Q 260 90 280 270" stroke="#16a34a" stroke-width="3.5" fill="none" />
    <path d="M 320 5 Q 340 130 315 210" stroke="#22c55e" stroke-width="3" fill="none" />

    <!-- Heart-shaped Pothos Leaves on Vines -->
    <circle cx="45" cy="80" r="14" fill="#4ade80" />
    <circle cx="40" cy="140" r="13" fill="#22c55e" />
    <circle cx="95" cy="60" r="16" fill="#16a34a" />
    <circle cx="85" cy="130" r="15" fill="#4ade80" />
    <circle cx="90" cy="200" r="14" fill="#22c55e" />
    <circle cx="155" cy="70" r="17" fill="#22c55e" />
    <circle cx="140" cy="150" r="18" fill="#16a34a" />
    <circle cx="160" cy="220" r="16" fill="#4ade80" />
    <circle cx="215" cy="90" r="15" fill="#15803d" />
    <circle cx="205" cy="160" r="14" fill="#22c55e" />
    <circle cx="275" cy="75" r="16" fill="#4ade80" />
    <circle cx="265" cy="145" r="17" fill="#16a34a" />
    <circle cx="280" cy="210" r="15" fill="#22c55e" />
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(450, 105)">
    <rect width="300" height="295" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" rx="8" />
    <text x="20" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">LIVING BEAM DESIGN</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Structural Beam Integration</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Troughs bolted directly to portal frame I-beams.</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. Natural Space Zoning</text>
    <text x="20" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Hanging 3-meter vine curtains divide desk pods naturally.</text>

    <text x="20" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. Built-In Wicking Sub-Irrigation</text>
    <text x="20" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Zero ladder watering needed; automated wicking line.</text>

    <text x="20" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Indestructible Trailing Species</text>
    <text x="20" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Golden Pothos, Heartleaf Philodendron, English Ivy.</text>
  </g>
</svg>