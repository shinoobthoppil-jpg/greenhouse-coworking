<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKoke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141814" />
      <stop offset="100%" stop-color="#1e2a1d" />
    </linearGradient>
    <radialGradient id="mossSphere" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgKoke)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">JAPANESE KOKEDAMA (FLOATING MOSS SPHERES)</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Bonsai Art Form • Twine-Bound Live Moss Balls • Suspended Aerial Forest Ambiance</text>

  <!-- Hanging Kokedamas -->
  <g transform="translate(60, 95)">
    <!-- Ceiling Truss -->
    <line x1="0" y1="0" x2="360" y2="0" stroke="#64748b" stroke-width="4" />

    <!-- Kokedama 1 (Left - High) -->
    <g transform="translate(60, 0)">
      <line x1="0" y1="0" x2="0" y2="100" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="0" cy="140" r="40" fill="url(#mossSphere)" stroke="#78350f" stroke-width="2" />
      <!-- String wrap -->
      <path d="M -35 125 Q 0 140 35 125 M -35 155 Q 0 140 35 155" stroke="#fef08a" stroke-width="1.5" fill="none" />
      <!-- Fern Leaves on Top -->
      <path d="M 0 100 Q -25 60 -40 40 Q -15 70 0 100" fill="#22c55e" />
      <path d="M 0 100 Q 0 50 0 30 Q 15 60 0 100" fill="#4ade80" />
      <path d="M 0 100 Q 25 60 40 40 Q 15 70 0 100" fill="#16a34a" />
    </g>

    <!-- Kokedama 2 (Mid - Low) -->
    <g transform="translate(180, 0)">
      <line x1="0" y1="0" x2="0" y2="170" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="0" cy="220" r="50" fill="url(#mossSphere)" stroke="#78350f" stroke-width="2" />
      <path d="M -45 200 Q 0 220 45 200 M -45 240 Q 0 220 45 240" stroke="#fef08a" stroke-width="1.5" fill="none" />
      <!-- Anthurium / broadleaf -->
      <path d="M 0 170 Q -40 120 -50 90 Q -20 130 0 170" fill="#15803d" />
      <path d="M 0 170 Q 30 110 50 80 Q 15 130 0 170" fill="#22c55e" />
      <circle cx="20" cy="95" r="8" fill="#f43f5e" />
    </g>

    <!-- Kokedama 3 (Right - Mid) -->
    <g transform="translate(300, 0)">
      <line x1="0" y1="0" x2="0" y2="120" stroke="#cbd5e1" stroke-width="1.5" />
      <circle cx="0" cy="160" r="38" fill="url(#mossSphere)" stroke="#78350f" stroke-width="2" />
      <path d="M -30 145 Q 0 160 30 145 M -30 175 Q 0 160 30 175" stroke="#fef08a" stroke-width="1.5" fill="none" />
      <path d="M 0 120 Q -20 80 -30 60 Q -10 90 0 120" fill="#4ade80" />
      <path d="M 0 120 Q 20 80 30 60 Q 10 90 0 120" fill="#16a34a" />
    </g>
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(460, 105)">
    <rect width="290" height="295" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" rx="8" />
    <text x="20" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">KOKEDAMA ART &amp; AMBIANCE</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Sculpted Soil &amp; Moss Ball</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Roots encased in keto clay soil, wrapped in live sheet moss.</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. Aerial Floating Installation</text>
    <text x="20" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Suspended via aircraft wire at varied ceiling heights.</text>

    <text x="20" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. Simple Dunk Watering</text>
    <text x="20" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Submerged in aquaponics pond for 5 minutes once weekly.</text>

    <text x="20" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Ideal Locations</text>
    <text x="20" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Mezzanine skybridge, atrium voids, quiet call lounge.</text>
  </g>
</svg>