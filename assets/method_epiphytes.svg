<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a12" />
      <stop offset="100%" stop-color="#222e1f" />
    </linearGradient>
    <linearGradient id="barkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgEpi)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">EPIPHYTE &amp; AIR PLANT COLUMNS</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Soil-Free Natural Mounting • Cork Bark Structural Wraps • Humidity-Driven Epiphytic Growth</text>

  <!-- Cork Column Diagram -->
  <g transform="translate(140, 105)">
    <!-- Central Pillar wrapped in Bark -->
    <rect x="50" y="0" width="80" height="295" fill="url(#barkGrad)" stroke="#291205" stroke-width="3" rx="8" />
    <line x1="60" y1="40" x2="120" y2="45" stroke="#451a03" stroke-width="2" />
    <line x1="65" y1="120" x2="115" y2="125" stroke="#451a03" stroke-width="2" />
    <line x1="55" y1="210" x2="125" y2="215" stroke="#451a03" stroke-width="2" />

    <!-- Staghorn Fern (Platycerium) -->
    <g transform="translate(30, 40)">
      <circle cx="20" cy="20" r="18" fill="#a3e635" opacity="0.9" />
      <!-- Antler fronds -->
      <path d="M 20 10 Q -20 -30 -40 -20 Q -20 5 10 15" fill="#84cc16" />
      <path d="M 20 10 Q -30 -50 -10 -60 Q 5 -20 20 10" fill="#65a30d" />
      <path d="M 20 10 Q 40 -40 60 -30 Q 30 5 20 10" fill="#84cc16" />
    </g>

    <!-- Wild Epiphytic Orchid -->
    <g transform="translate(90, 130)">
      <path d="M 0 0 Q 30 -20 50 -10 Q 30 10 0 0" fill="#15803d" />
      <path d="M 0 0 Q 40 10 60 30 Q 20 30 0 0" fill="#16a34a" />
      <!-- Orchid Flower -->
      <circle cx="45" cy="5" r="10" fill="#f43f5e" />
      <circle cx="45" cy="5" r="4" fill="#fef08a" />
    </g>

    <!-- Tillandsia Air Plants -->
    <g transform="translate(25, 210)">
      <path d="M 20 20 L -15 0 M 20 20 L -20 10 M 20 20 L -25 25 M 20 20 L -15 35 M 20 20 L 0 45" stroke="#a7f3d0" stroke-width="2.5" fill="none" />
      <circle cx="20" cy="20" r="8" fill="#059669" />
    </g>
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(420, 105)">
    <rect width="330" height="295" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" rx="8" />
    <text x="20" y="32" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">EPIPHYTIC SYSTEM SPECS</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Natural Cork Bark Mounting</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Structural building columns wrapped in textured virgin bark.</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. 100% Soil-Free Biophilia</text>
    <text x="20" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Zero dirt, zero muddy runoff, zero soil-borne pathogens.</text>

    <text x="20" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. Kerala Humidity Utilization</text>
    <text x="20" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Trichomes on Tillandsia leaves absorb moisture from air.</text>

    <text x="20" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Botanical Diversity</text>
    <text x="20" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Staghorn ferns (Platycerium), native orchids, Tillandsia.</text>
  </g>
</svg>