<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1216" />
      <stop offset="100%" stop-color="#2d1e26" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgMush)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1.5" rx="12" />

  <text x="50" y="55" fill="#f43f5e" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">ARCHITECTURAL MUSHROOM MYCOLOGY CABINET</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Gourmet Fungi Fruiting • CO2 ↔ O2 Balancing with Greenhouse Plants • 90% RH Humidity Control</text>

  <!-- Glass Cabinet Diagram -->
  <g transform="translate(80, 105)">
    <rect x="0" y="0" width="280" height="290" fill="rgba(255, 255, 255, 0.04)" stroke="#e2e8f0" stroke-width="2.5" rx="8" />
    <!-- Shelves -->
    <line x1="0" y1="95" x2="280" y2="95" stroke="#64748b" stroke-width="2" />
    <line x1="0" y1="190" x2="280" y2="190" stroke="#64748b" stroke-width="2" />

    <!-- Substrate Blocks with Oyster Mushrooms -->
    <!-- Shelf 1 -->
    <rect x="30" y="45" width="60" height="45" fill="#78350f" rx="3" />
    <g transform="translate(90, 50)"><path d="M 0 0 C 15 -15 35 -10 30 10 C 20 15 5 10 0 0" fill="#38bdf8" opacity="0.9" /><path d="M 0 10 C 15 0 30 15 20 25 C 10 25 0 20 0 10" fill="#0ea5e9" /></g>
    <rect x="150" y="45" width="60" height="45" fill="#78350f" rx="3" />
    <g transform="translate(210, 50)"><path d="M 0 0 C 15 -15 35 -10 30 10 C 20 15 5 10 0 0" fill="#f43f5e" opacity="0.9" /><path d="M 0 10 C 15 0 30 15 20 25 C 10 25 0 20 0 10" fill="#fb7185" /></g>

    <!-- Shelf 2 -->
    <rect x="30" y="140" width="60" height="45" fill="#78350f" rx="3" />
    <circle cx="110" cy="155" r="22" fill="#f8fafc" opacity="0.9" /> <!-- Lion's mane -->
    <text x="110" y="160" text-anchor="middle" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold">Lion's Mane</text>

    <rect x="150" y="140" width="60" height="45" fill="#78350f" rx="3" />
    <g transform="translate(210, 145)"><path d="M 0 0 C 15 -15 35 -10 30 10 C 20 15 5 10 0 0" fill="#38bdf8" opacity="0.9" /></g>

    <!-- Bottom Misting Basin -->
    <rect x="10" y="240" width="260" height="40" fill="rgba(56, 189, 248, 0.2)" rx="4" />
    <text x="140" y="265" text-anchor="middle" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">Ultrasonic Humidity Basin (85-90% RH)</text>
  </g>

  <!-- Explanatory Box Right -->
  <g transform="translate(410, 105)">
    <rect width="340" height="290" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.3)" rx="8" />
    <text x="20" y="32" fill="#f43f5e" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">MYCOLOGY INTEGRATION SPECS</text>
    
    <text x="20" y="65" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">1. Automated Climate Control</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">HEPA fan + ultrasonic humidifier keeps 88% humidity.</text>

    <text x="20" y="120" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">2. Symbiotic CO2 Release</text>
    <text x="20" y="140" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Mushrooms exhale CO2 directly feeding nearby plants.</text>

    <text x="20" y="175" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">3. Brain Food &amp; Culinary Species</text>
    <text x="20" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Blue Oyster, Pink Oyster, and Lion's Mane (nootropics).</text>

    <text x="20" y="230" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">4. Community Harvesting</text>
    <text x="20" y="250" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5">Harvest fresh organic mushrooms for workspace meals.</text>
  </g>
</svg>