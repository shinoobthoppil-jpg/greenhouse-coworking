<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgZip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1813" />
      <stop offset="100%" stop-color="#142c22" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgZip)" rx="16" />
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" rx="12" />
  
  <!-- Header Title -->
  <text x="50" y="55" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">ZIPGROW™ MATRIX TOWER SYSTEM</text>
  <text x="50" y="75" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">High-Density Vertical Matrix Media • Drip-Irrigated Wall Channels</text>

  <!-- Drip Irrigation Pipe Top -->
  <rect x="120" y="100" width="560" height="14" fill="#334155" rx="4" />
  <text x="690" y="112" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Drip Header (1 GPH)</text>

  <!-- Tower 1 -->
  <g transform="translate(160, 114)">
    <rect x="0" y="0" width="50" height="260" fill="url(#towerGrad)" rx="4" />
    <rect x="18" y="10" width="14" height="240" fill="url(#matrixGrad)" rx="2" />
    <!-- Plant Leaves sticking out -->
    <circle cx="25" cy="50" r="14" fill="#22c55e" opacity="0.9" />
    <circle cx="15" cy="45" r="12" fill="#4ade80" opacity="0.8" />
    <circle cx="35" cy="48" r="13" fill="#16a34a" opacity="0.8" />

    <circle cx="25" cy="110" r="15" fill="#22c55e" opacity="0.9" />
    <circle cx="12" cy="105" r="13" fill="#4ade80" opacity="0.8" />
    <circle cx="38" cy="108" r="14" fill="#15803d" opacity="0.8" />

    <circle cx="25" cy="170" r="15" fill="#22c55e" opacity="0.9" />
    <circle cx="14" cy="165" r="12" fill="#4ade80" opacity="0.8" />
    <circle cx="36" cy="168" r="13" fill="#16a34a" opacity="0.8" />

    <circle cx="25" cy="230" r="14" fill="#22c55e" opacity="0.9" />
    <circle cx="15" cy="225" r="12" fill="#4ade80" opacity="0.8" />
  </g>

  <!-- Tower 2 -->
  <g transform="translate(260, 114)">
    <rect x="0" y="0" width="50" height="260" fill="url(#towerGrad)" rx="4" />
    <rect x="18" y="10" width="14" height="240" fill="url(#matrixGrad)" rx="2" />
    <circle cx="25" cy="50" r="15" fill="#10b981" opacity="0.9" />
    <circle cx="12" cy="45" r="13" fill="#34d399" opacity="0.8" />
    <circle cx="25" cy="110" r="15" fill="#10b981" opacity="0.9" />
    <circle cx="35" cy="108" r="14" fill="#059669" opacity="0.8" />
    <circle cx="25" cy="170" r="15" fill="#10b981" opacity="0.9" />
    <circle cx="14" cy="165" r="12" fill="#34d399" opacity="0.8" />
    <circle cx="25" cy="230" r="14" fill="#10b981" opacity="0.9" />
  </g>

  <!-- Tower 3 (Cutaway Detail) -->
  <g transform="translate(360, 114)">
    <rect x="0" y="0" width="50" height="260" fill="url(#towerGrad)" stroke="#38bdf8" stroke-width="2" rx="4" />
    <rect x="12" y="10" width="26" height="240" fill="#1e293b" />
    <rect x="18" y="15" width="14" height="230" fill="url(#matrixGrad)" stroke="#4ade80" stroke-dasharray="3,3" />
    <!-- Water Trickle Arrows -->
    <path d="M 25 30 L 25 60 M 22 55 L 25 60 L 28 55" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 25 120 L 25 150 M 22 145 L 25 150 L 28 145" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 25 200 L 25 230 M 22 225 L 25 230 L 28 225" stroke="#38bdf8" stroke-width="2" fill="none" />
  </g>

  <!-- Drainage Gutter Bottom -->
  <rect x="120" y="374" width="560" height="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="3" />
  <text x="690" y="388" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Catchment Gutter</text>

  <!-- Explanatory Callout Box Right -->
  <g transform="translate(450, 140)">
    <rect width="290" height="210" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" rx="8" />
    <text x="18" y="30" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold">ANATOMY &amp; MECHANICS</text>
    
    <text x="18" y="60" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">1. Extruded PVC Housing (5ft / 8ft)</text>
    <text x="18" y="80" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Hangs vertically along perimeter walls.</text>

    <text x="18" y="110" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">2. Reusable Matrix Media Fleece</text>
    <text x="18" y="130" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Provides biological surface area for roots.</text>

    <text x="18" y="160" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">3. Gravity Water Trickle</text>
    <text x="18" y="180" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Water trickles silently, draining to gutter.</text>
  </g>
</svg>